name: Build and Push Image

# 在 GitHub 上自动把 jizhang 构建成多架构镜像，并推送到：
#   1) Docker Hub  —— 飞牛 NAS 通过 docker.io 镜像源拉取（已验证你的网络可通，与 cashbook4 同路径）
#   2) GHCR        —— 备用（GitHub 容器仓库，GITHUB_TOKEN 免密）
# 推完后在飞牛上只要 `docker compose up -d` 拉镜像即可，无需在 NAS 上编译。
#
# 需要仓库 Secrets：
#   DOCKERHUB_USERNAME  —— 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN     —— Docker Hub 访问令牌（在 hub.docker.com -> Account Settings -> Security -> New Access Token 生成，勾选 Read/Write）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: jizhang

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (交叉编译 arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算版本号（发布时间，北京时间 vYYMMDD-HHMM）
        id: ver
        run: echo "APP_VERSION=v$(TZ=Asia/Shanghai date +%y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.APP_VERSION }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 将 GHCR 镜像包设为 Public（便于备用免登录拉取）
        if: ${{ always() }}
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/jizhang/visibility \
            -d '{"visibility":"public"}' \
            || echo "若失败，请到 GitHub -> Packages -> jizhang -> Settings 把可见性改为 Public"

      - name: 创建 / 更新 GitHub Release（与镜像同步）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.APP_VERSION }}"
          DH="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          REPO="${{ github.repository }}"
          PREV=$(git tag --sort=-creatordate | head -1)
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          LOG=$(git log --no-merges --pretty=format:"- %s" -n 25 "$RANGE")
          BODY=$'## 镜像（构建于 '"$TAG"$'\n\n- Docker Hub：docker pull '"$DH"$':latest  或  docker pull '"$DH"$':'"$TAG"$'\n- GHCR：docker pull ghcr.io/'"$REPO"$':latest  或  docker pull ghcr.io/'"$REPO"$':'"$TAG"$'\n\n## 本次更新\n'"$LOG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明"
            gh release edit "$TAG" --notes "$BODY"
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" --title "$TAG" --latest --notes "$BODY"
          fi
