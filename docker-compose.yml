services:
  cashbook:
    # 直接拉取预编译镜像（已发布到 Docker Hub，走 docker.io 镜像源，与 cashbook4 同路径）
    # 镜像位于 Docker Hub 账户 h223492759；一般无需改动。如需覆盖，在 .env 里设 DOCKERHUB_USERNAME
    image: ${DOCKERHUB_USERNAME:-h223492759}/jizhang:latest
    container_name: jizhang
    restart: unless-stopped

    ports:
      # 宿主机端口:容器端口 —— 若 9600 被占用，只改冒号左边
      - "9600:9600"

    environment:
      TZ: Asia/Shanghai
      PORT: 9600
      DATA_DIR: /app/data

      # ---- 必改：JWT 密钥，随便一串长随机字符 ----
      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-long-random-string}"

      # ---- 首次启动自动创建的管理员账号 ----
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"

      # ---- 自助注册开关，默认关闭：账号由管理员在「用户管理」页创建 ----
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"

      # ---- AI 记账/分析（可选，留空则自动走本地规则解析）----
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"

    volumes:
      # SQLite 数据库落在宿主机，容器删了数据还在
      - ./data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9600/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
